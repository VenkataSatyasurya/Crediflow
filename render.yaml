services:
  - type: web
    name: crediflow-backend
    runtime: node
    rootDir: crediflow/backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        value: crediflow_secret_jwt_key_2026_auth
      - key: MONGO_URI
        sync: false
